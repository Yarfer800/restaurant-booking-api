[project]
name = 'restaurant-booking-api'
version = '0.1.0'
description = 'REST API для бронирования столов в ресторанах'
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
    'fastapi>=0.115',
    'uvicorn[standard]>=0.30',
    'sqlalchemy[asyncio]>=2.0',
    'asyncpg>=0.29',
    'alembic>=1.13',
    'redis>=5.0',
    'pyjwt>=2.8',
    'pydantic>=2.9',
    'pydantic-settings>=2.4',
    'email-validator>=2.2',
]

[dependency-groups]
dev = [
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'httpx>=0.27',
    'ruff>=0.6',
    'aiosqlite>=0.20',
    'greenlet>=3.1',
    'fakeredis>=2.20',
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = 'auto'
pythonpath = ['.']
testpaths = ['tests']

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']
ignore = ['B008']  # FastAPI Depends/Query в дефолтных аргументах